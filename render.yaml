services:
  - type: web
    name: cinestream
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client && npm ci --prefix server && npm --prefix client run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false

